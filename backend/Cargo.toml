[package]
name = "stretch-api"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
axum = "=0.8.9"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }
tokio-stream = { version = "=0.1.19", features = ["sync"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
rusqlite = { version = "=0.41.1", features = ["bundled", "backup"] }
chrono = { version = "=0.4.45", features = ["serde"] }
tower-http = { version = "=0.7.1", features = ["fs", "set-header"] }
tracing = "=0.1.44"
tracing-subscriber = "=0.3.23"

[dev-dependencies]
tempfile = "=3.27.0"
tower = { version = "=0.5.3", features = ["util"] }
http-body-util = "=0.1.5"
